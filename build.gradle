plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

def env = System.getenv()
def tag = providers.environmentVariable('TAG')
version = tag.orElse("${mod_version}-development").get()
group = mod_group

base {
    archivesName = mod_archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

javadoc {
    failOnError = true
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            gameDirectory = file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    mavenLocal {
        // A stale local MMDLib build must not shadow the published one
        content {
            excludeGroup 'zone.moddev.mc.lib'
        }
    }
    maven {
        name = 'ModDevZone'
        url = uri('https://maven.moddev.zone/releases')
        content {
            includeGroupByRegex 'zone\\.moddev\\.mc.*'
        }
    }
}

// MMDLib publishes every loader under one artifact, distinguished by a '+<Loader>' version suffix
configurations.configureEach {
    resolutionStrategy.componentSelection.all { ComponentSelection selection ->
        def candidate = selection.candidate
        if (candidate.group == 'zone.moddev.mc.lib' && candidate.module == 'mmdlib' && !candidate.version.endsWith('+Neo')) {
            selection.reject('not a NeoForge build of MMDLib')
        }
    }
}

dependencies {
    implementation "zone.moddev.mc.lib:mmdlib:${mmdlib_version}"
    runtimeOnly "zone.moddev.mc.orespawn:OreSpawn:${orespawn_version}"
}

// Kept as a separate task (rather than expanding in processResources) so IDE runs see the metadata too
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neoforge_version_range : neoforge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : project.version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        curseforge_url         : curseforge_id ? "https://www.curseforge.com/projects/${curseforge_id}" : homepage_url,
        issue_url              : issue_url,
        update_url             : update_url,
        mmdlib_version_range   : mmdlib_version_range,
        orespawn_version_range : orespawn_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_archive_name
            from components.java
        }
    }
    repositories {
        if (env.MAVEN_UPLOAD_URL) {
            maven {
                url = uri(env.MAVEN_UPLOAD_URL)
                credentials {
                    username = env.MAVEN_UPLOAD_USERNAME
                    password = env.MAVEN_UPLOAD_PASSWORD
                }
            }
        }
    }
}

idea {
    module {
        downloadSources = true
    }
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

// Integration tests are opt-in and are never included in the distributable mod.
if (project.hasProperty('gameTests')) {
    sourceSets {
        gameTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations.gameTestImplementation.extendsFrom(configurations.implementation)
    configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
    neoForge {
        addModdingDependenciesTo(sourceSets.gameTest)
        mods { "${mod_id}" { sourceSet(sourceSets.gameTest) } }
        runs {
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = file('build/gametest-run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
        }
    }
}
