plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = "${minecraft_version}-${mod_version}"
if (System.getenv('BUILD_NUMBER')) {
    version += '.' + System.getenv('BUILD_NUMBER')
}
group = mod_group_id

base {
    archivesName = 'PowerAdvantage'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    //withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

javadoc {
    failOnError = true
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = 'ModDevZone'
        url = uri('https://maven.moddev.zone/releases')
        content {
            includeGroupByRegex 'zone\\.moddev\\.mc.*'
        }
    }
    // MMDLib 2.0 is not published yet; it lives in libs/ until it is
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation files("libs/mmdlib-${mmdlib_version}.jar")
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        mmdlib_version_range   : mmdlib_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

class Secrets {
    def data = null

    def getProperty(String key) {
        return data ? data[key] : ''
    }
}

def secret = new Secrets()
def secretFile = file(System.getenv('SECRET_FILE') ?: 'secret.json')
if (secretFile.exists()) {
    secretFile.withReader {
        secret.data = new groovy.json.JsonSlurper().parse it
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        if (secret.data) {
            maven {
                credentials {
                    username = secret.username
                    password = secret.password
                }
                url = secret.url
            }
        }
    }
}

// Integration tests are opt-in and are never included in the distributable mod.
if (project.hasProperty('gameTests')) {
    sourceSets {
        gameTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations.gameTestImplementation.extendsFrom(configurations.implementation)
    configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
    neoForge {
        addModdingDependenciesTo(sourceSets.gameTest)
        mods { "${mod_id}" { sourceSet(sourceSets.gameTest) } }
        runs {
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = file('build/gametest-run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
        }
    }
}
