# Project
# Version string only used in dev, however when making a tag on github it should be like major.minor.bug.mc+loader
# Example: 3.1.1. 1 21 01 2 - the Minecraft version without dots, then the loader (1 Forge, 2 NeoForge).
mod_version = 3.1.1.121012
mod_name = Power Advantage
mod_id = poweradvantage
mod_archive_name = PowerAdvantage
mod_description = API for DrCyano's power systems mods.
mod_group = zone.moddev.mc.poweradvantage
mod_authors = DrCyano (aka Cyanobacterium), DShadowWolf
mod_license = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/PowerAdvantageRevived/refs/heads/master-1.21.1-neo/LICENSE.md
# No CurseForge project yet; while this is empty the mod's display link falls back to homepage_url
curseforge_id =
homepage_url = https://github.com/MinecraftModDevelopmentMods/PowerAdvantageRevived
update_url = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/PowerAdvantageRevived/refs/heads/master-1.21.1-neo/update.json
issue_url = https://github.com/MinecraftModDevelopmentMods/PowerAdvantageRevived/issues

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.21.2)
neoforge_version = 21.1.265
neoforge_version_range = [21.1.247,21.2)
loader_version_range = [4,)

# Any 2.0.x NeoForge build from 2.0.1 on; build.gradle rejects the other loaders' '+<Loader>' variants
mmdlib_version = [2.0.1,2.1)
mmdlib_version_range = [2.0.1,2.1)
# OreSpawn places the crude oil deposits from data/poweradvantage/orespawn/provider.json
orespawn_version = 4.1.0.121012
orespawn_version_range = [4.1.0,)

# Parchment (parameter names + javadocs on top of Mojang mappings)
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = false
